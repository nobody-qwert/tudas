<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Timeline & Family Tree of Religions and Sacred Texts</title>
<link rel="stylesheet" href="styles.css?v=30">
</head>
<body>
<header class="controls" aria-label="Timeline and diagram controls">
  <a class="home-link" href="../">← Home</a>
  <div class="search-control">
    <label for="search" class="sr-only">Search</label>
    <input id="search" type="search" placeholder="Search names or texts…" aria-controls="searchResults" autocomplete="off">
    <div id="searchResults" hidden aria-label="Search results"></div>
  </div>
  <label class="branch-control"><span class="sr-only">Tradition / region</span>
    <select id="groupFilter">
      <option value="all">All branches</option>
      <option>Ancient & oral</option><option>Iranian</option><option>Jewish</option><option>Christian</option><option>Islamic</option><option>Bábí & Bahá’í</option><option>South Asian</option><option>Chinese & East Asian</option><option>Other / modern</option>
    </select>
  </label>
  <button id="toggleList" type="button" aria-pressed="false" aria-controls="listView">List view</button>
</header>

<main class="workspace">
<div id="diagramArea" class="main">
  <div id="stageWrap">
    <svg id="branchAxis" role="img" aria-label="Tradition and region axis">
      <g id="branchLabels"></g>
    </svg>
    <svg id="stage" role="group" aria-label="Interactive time tree of religions and sacred texts">
      <defs>
        <marker id="arrow-lineage" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e7e9ee"/></marker>
        <marker id="arrow-text" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#6fb0dc"/></marker>
        <marker id="arrow-selected" viewBox="0 0 10 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#67e8f9"/></marker>
      </defs>
      <g id="viewport">
        <g id="grid"></g>
        <g id="edges"></g>
        <g id="nodes"></g>
        <g id="selectedEdgesOverlay" aria-hidden="true"></g>
      </g>
      <g id="axisLabels">
        <rect class="axis-background" x="0" y="0" height="30"/>
      </g>
    </svg>
      <div id="nodeInfo" class="hidden" aria-live="polite">
      <button id="closeInfo" class="close" type="button" aria-label="Close details">×</button>
      <div id="nodeInfoContent"></div>
    </div>
  </div>
</div>

<div id="listView">
  <p id="listEmpty" hidden>No results. Try another search or choose All branches.</p>
  <table>
    <thead><tr><th>Date</th><th>Name</th><th>Branch</th><th>Type</th><th>Notes</th></tr></thead>
    <tbody id="listBody"></tbody>
  </table>
</div>

<section id="helpPanel" role="dialog" aria-labelledby="helpTitle" hidden>
  <button id="closeHelp" class="close" type="button" aria-label="Close information">×</button>
  <h2 id="helpTitle"></h2>
  <div id="helpContent"></div>
</section>
</main>

<footer class="bottom-bar" aria-label="Timeline information">
  <button type="button" data-help="guide" aria-controls="helpPanel" aria-haspopup="dialog">Connection guide</button>
  <button type="button" data-help="about" aria-controls="helpPanel" aria-haspopup="dialog">About dates</button>
  <button type="button" data-help="sources" aria-controls="helpPanel" aria-haspopup="dialog">Sources</button>
  <span class="bottom-hint">Drag to move · pinch or scroll to zoom</span>
</footer>

<template id="help-guide">
  <div class="legrow"><span class="sample lineage"></span> historical continuity / descent</div>
  <div class="legrow"><span class="sample within"></span> tradition within / shared communion</div>
  <div class="legrow"><span class="sample influence"></span> influence / shared milieu (not descent)</div>
  <div class="legrow"><span class="sample text"></span> scripture / textual relationship</div>
  <div class="legrow"><span class="sample event"></span> council / historical event context</div>
  <p><span class="selected-key">Cyan: selected</span> · <span class="related-key">Gold: related</span></p>
  <p>Arrowheads mark the receiving box on continuity and text links. Tradition-within, influence and event links have no arrows. A tradition within a religion is not necessarily a separate sect.</p>
  <p>Text links can mean translation, inclusion, collection or scriptural authority. Each connection has an explanation and a source in the selected box’s details. Dates increase from left to right; curves can bend around nearby boxes.</p>
  <p>Select a box to highlight its connections. Select an empty area to clear the selection.</p>
</template>

<template id="help-about">
  <p>Connections were reviewed to avoid several common overstatements: dashed influence lines are not parent-child claims, council/event links are not institutional descent, the Church of the East is not drawn as a branch of Chalcedon, Oriental Orthodoxy is not drawn as descending from Chalcedonian Christianity, and debated Indus→Vedic or Zoroastrian→Yazidi direct-descent arrows are omitted. The Bábí and Bahá’í religions have their own branch because their historical roots in a Shiʿi environment do not make them Islamic denominations. This is intentionally broad rather than exhaustive. Many indigenous and oral religions have no recoverable “start date.”
  Labels such as “Hinduism,” “Gnosticism,” “Judaism,” “Christianity,” “Daoism,” and “Shintō” each cover internally diverse histories.
  The time coordinate therefore represents a useful historical marker (earliest evidence, formative period, major institutional split, or text date) rather than a claim that a complete religion suddenly appeared in one year.</p>
</template>

<template id="help-sources">
  <p>Each connection links to its reference in the selected box’s details. References explain the relationship; they do not make uncertain dates exact.</p>
  <p>Some sources require a subscription. This diagram is a broad overview, not a complete history of every tradition.</p>
</template>

<script src="history.js?v=1"></script>
<script src="script.js?v=33"></script>
</body>
</html>
